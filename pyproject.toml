[project]
name = "creo-ai-copilot"
version = "0.1.0"
description = "Enterprise AI Engineering Copilot for PTC Creo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
