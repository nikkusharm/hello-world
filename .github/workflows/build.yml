name: Build APK
on:
  push:
    branches: ["claude/build-cricAR-app-w81ZG"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install deps
        working-directory: ./cricar
        run: npm install --legacy-peer-deps
      - name: Build APK
        working-directory: ./cricar/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cricar-apk
          path: cricar/android/app/build/outputs/apk/release/app-release.apk